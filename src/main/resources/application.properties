spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestopago}
server.port=${PORT:8081}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
gestopago.auth.url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
spring.cloud.config.import-check.enabled=false
gestopago.product.url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
gestopago.productos.timeout-ms=15000
gestopago.productos.sync.cron=1 58 0 * * *
spring.cloud.openfeign.client.config.gestoPagoProduct.connectTimeout=${gestopago.productos.timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProduct.readTimeout=${gestopago.productos.timeout-ms}

gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_AUTH_REFRESH_RATE_MS:3600000}
gestopago.auth.token-ttl-seconds=${GESTOPAGO_AUTH_TOKEN_TTL_SECONDS:82800}

# Configuración de transacciones GestoPago (sendTx) y cifrado AES-256
gestopago.tx.url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:083}
gestopago.tx.api-key=${GESTOPAGO_API_KEY:}
gestopago.tx.connect-timeout-ms=${GESTOPAGO_TX_CONNECT_TIMEOUT_MS:10000}
gestopago.tx.read-timeout-ms=${GESTOPAGO_TX_READ_TIMEOUT_MS:20000}
gestopago.tx.validar-referencia-previa=${GESTOPAGO_VALIDAR_REFERENCIA_PREVIA:false}
gestopago.tx.conciliacion.minutos-umbral=${GESTOPAGO_CONCILIACION_MINUTOS_UMBRAL:5}
gestopago.tx.conciliacion.intervalo-ms=${GESTOPAGO_CONCILIACION_INTERVALO_MS:60000}
spring.cloud.openfeign.client.config.gestoPagoTx.connectTimeout=${gestopago.tx.connect-timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoTx.readTimeout=${gestopago.tx.read-timeout-ms}

gestopago.aes.secret-key=${GESTOPAGO_AES_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.aes.iv=${GESTOPAGO_AES_IV:p5ldmBPdd/9pjC0bDC/nSg==}

# Configuración de NIP Transaccional
seguridad.nip.longitud=${NIP_LONGITUD:4}
seguridad.nip.max-intentos=${NIP_MAX_INTENTOS:3}
seguridad.nip.bloqueo-minutos=${NIP_BLOQUEO_MINUTOS:15}

# Configuración de Hibernate para operaciones en lote
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Optimización de HikariCP para pruebas de carga y alto rendimiento
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Optimización de Tomcat para concurrencia masiva (JMeter)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

spring.data.redis.url=${REDIS_URL}
