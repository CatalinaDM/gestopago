spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestopago}
server.port=${PORT:8081}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
gestopago.auth.url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
spring.cloud.config.import-check.enabled=false
gestopago.product.url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
gestopago.productos.timeout-ms=15000
gestopago.productos.sync.cron=1 58 0 * * *
spring.cloud.openfeign.client.config.gestoPagoProduct.connectTimeout=${gestopago.productos.timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProduct.readTimeout=${gestopago.productos.timeout-ms}

gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}

# Configuración de Hibernate para operaciones en lote
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Optimización de HikariCP para pruebas de carga y alto rendimiento
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Optimización de Tomcat para concurrencia masiva (JMeter)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

spring.data.redis.url=${REDIS_URL}